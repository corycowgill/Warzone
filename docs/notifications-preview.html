<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Warzone / Compact Alerts</title><link rel="stylesheet" href="css/art-direction.css"><style>body{margin:0;background:#21362c;color:#e5e0ce;font:14px system-ui;min-height:100vh}header{position:fixed;left:20px;top:20px;max-width:50%;padding:16px;background:#14272c}h1{font-size:18px}button{padding:8px;background:#344b49;color:#eee;border:1px solid #879586;margin:3px}.battlefield{position:absolute;left:25%;top:44%;color:#a9b6a0;font-size:14px;letter-spacing:2px}footer{position:fixed;bottom:20px;left:20px}</style></head><body><header><h1>WARZONE / COMPACT ALERTS</h1><button id="burst">Production burst</button><button id="warning">Combat warning</button><button id="clear">Clear</button><p id="status">No alerts</p></header><div class="battlefield">BATTLEFIELD CENTER STAYS CLEAR</div><div id="hud-notifications"></div><footer>Live notification component and game stylesheet</footer><script type="module">import {NotificationFeed} from './js/ui/NotificationFeed.js';const area=document.querySelector('#hud-notifications'),feed=new NotificationFeed(area);document.querySelector('#burst').onclick=()=>{for(let i=0;i<20;i++)feed.push('Infantry produced!','#b5d2ad');feed.push('Tank produced!','#b5d2ad');};document.querySelector('#warning').onclick=()=>feed.push('Headquarters under attack!','#edb979');document.querySelector('#clear').onclick=()=>feed.clear();new MutationObserver(()=>document.querySelector('#status').textContent=`${area.children.length} of 3 alert slots`).observe(area,{childList:true,subtree:true,characterData:true});</script></body></html>
