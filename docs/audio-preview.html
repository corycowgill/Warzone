<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warzone AI audio review</title>
<style>body{background:#101e29;color:#d6e3eb;font:16px system-ui;max-width:900px;margin:40px auto;padding:20px}h1{font-size:26px}button{padding:10px 16px;border:1px solid #68899b;border-radius:5px;background:#223a49;color:inherit;margin:4px;cursor:pointer}#tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}article{padding:12px;border:1px solid #546b7855;border-radius:6px}audio{width:100%}p{color:#b5cbd7}output{display:block;margin:20px 0;color:#82dfb5}</style></head><body>
<h1>WARZONE / GENERATED AUDIO</h1><p>Original music, effects and ambience generated locally with Stable Audio 3. The mixer buttons exercise the actual game sound manager. Individual recordings can be reviewed below.</p>
<nav><button id="menu">Menu mixer</button><button id="battle">Battle mixer</button><button id="combat">Combat intensity</button><button id="cannon">Tank cannon</button><button id="stop">Stop mixer</button></nav><output id="status">Ready — audio starts only after you click.</output><section id="tracks"></section>
<script type="module">
import {SoundManager} from '../js/systems/SoundManager.js';
const game={state:'MENU',terrain:{mapTemplate:'plains'},settingsManager:{settings:{audio:{masterVolume:.5,musicVolume:.5,voiceEnabled:false}}}};
const manager=new SoundManager(game),status=document.querySelector('#status');
async function ready(name){if(!manager.initialized)manager.initAudio();await manager.battleAudio.ready;const buffer=await manager.generatedAudio.load(name);status.textContent=buffer?`${name}: decoded ${buffer.duration.toFixed(2)} seconds; ${manager.battleAudio.buffers.size} generated effects ready.`:`Failed to decode ${name}`;}
document.querySelector('#menu').onclick=async()=>{await ready('menu');game.state='MENU';manager.onStateChange('MENU');};
document.querySelector('#battle').onclick=async()=>{await ready('game');game.state='PLAYING';manager.onStateChange('PLAYING');};
document.querySelector('#combat').onclick=()=>{manager.notifyCombat();manager.notifyCombat();manager.notifyCombat();status.textContent='Combat layer raised';};
document.querySelector('#cannon').onclick=async()=>{await ready('cannon');manager.play('attack',{unitType:'tank'});};
document.querySelector('#stop').onclick=()=>{manager.stopAllMusic();manager.stopAmbient();manager.battleAudio?.stop();status.textContent='Mixer stopped';};
let previous=performance.now();function tick(now){manager.update(Math.min(.1,(now-previous)/1000));previous=now;requestAnimationFrame(tick);}requestAnimationFrame(tick);
const manifest=await fetch('../assets/audio/generated/manifest.json').then(r=>r.json());
for(const [name,asset]of Object.entries(manifest.assets)){const card=document.createElement('article'),title=document.createElement('p'),audio=document.createElement('audio');title.textContent=(asset.title??name)+' · '+asset.seconds.toFixed(1)+' s';audio.controls=true;audio.preload='none';audio.src='../assets/audio/generated/'+asset.file;card.append(title,audio);document.querySelector('#tracks').append(card);}
</script></body></html>
